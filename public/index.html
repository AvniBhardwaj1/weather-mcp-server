<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather MCP — Demo UI</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 20px; max-width: 900px; margin: auto }
    input, button, select { padding: 8px; margin: 4px 0 }
    .card { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-top: 12px }
    .forecast-grid { display:flex; gap:10px; margin-top:10px }
    .forecast-day { flex:1; border:1px solid #eee; padding:8px; border-radius:6px }
    pre { background:#f8f8f8; padding:8px; border-radius:6px; overflow:auto }
  </style>
</head>
<body>
  <h1>Weather MCP — Demo UI</h1>
  <p>Enter a city name or coordinates, then request current conditions or a forecast.</p>

  <div class="card">
    <label>City name: <input id="city" placeholder="e.g. London, New York"></label>
    <div>Or coordinates: lat <input id="lat" style="width:110px"> lon <input id="lon" style="width:110px"></div>
    <div style="margin-top:8px">
      <label><input type="checkbox" id="includeRaw"> Include raw response</label>
    </div>
    <div style="margin-top:8px">
      <label>Days: <select id="days"><option>1</option><option selected>3</option><option>5</option></select></label>
    </div>
    <div style="margin-top:8px">
      <button id="btnCurrent">Get Current</button>
      <button id="btnForecast">Get Forecast</button>
      <button id="btnClear">Clear</button>
    </div>
  </div>

  <div id="result" class="card" style="display:none">
    <h2 id="resTitle">Result</h2>
    <div id="current"></div>
    <div id="forecast"></div>
    <h3>Raw response</h3>
    <pre id="raw"></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
